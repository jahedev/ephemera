<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>New Tab</title>
<link rel="stylesheet" href="css/newtab.css">
</head>
<body>
<canvas id="wall"></canvas>

<form id="search" class="hidden" autocomplete="off">
  <div id="engines">
    <button type="button" class="eng" data-engine="google" title="Google">G</button>
    <button type="button" class="eng" data-engine="youtube" title="YouTube">YT</button>
    <button type="button" class="eng" data-engine="duckduckgo" title="DuckDuckGo">DDG</button>
  </div>
  <input id="q" type="text" placeholder="Search&hellip;" spellcheck="false">
</form>

<div id="caption"></div>

<div id="controls">
  <button class="ctl" id="btn-new" title="New wallpaper (N)">
    <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.42 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
  </button>
  <button class="ctl" id="btn-download" title="Download wallpaper in 4K (D)">
    <svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg>
  </button>
  <button class="ctl" id="btn-settings" title="Settings">
    <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
  </button>
</div>

<div id="panel" class="hidden">
  <h3>Settings</h3>
  <div class="row"><span>Search bar</span><input type="checkbox" id="opt-search"></div>
  <div class="row" id="row-engine"><span>Engine</span>
    <div class="seg" id="opt-engine">
      <button data-v="google">Google</button>
      <button data-v="youtube">YouTube</button>
      <button data-v="duckduckgo">DuckDuckGo</button>
    </div>
  </div>
  <div class="row"><span>Style</span><select id="opt-style"></select></div>
  <p class="hint">Shortcuts: N new wallpaper &middot; D download &middot; / search</p>
</div>

<script type="module" src="js/newtab.js"></script>
</body>
</html>
